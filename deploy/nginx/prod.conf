server {
    listen 80; #HTTP 요청 수신
    server_name jinwoong-sopt39.p-e.kr;


    location /.well-known/acme-challenge/ {
        root /var/www/certbot; #인증서 발급 갱신 시 도메인 확인에 사용할 경로
    }

    location / {
        return 301 https://$host$request_uri; #나머지 HTTP요청을 HTTPS로 전환
    }
}

server {
    listen 443 ssl; #HTTPS요청 수신
    server_name jinwoong-sopt39.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/jinwoong-sopt39.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinwoong-sopt39.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; #EC2에서 발급한 인증서와 개인 키 사용

    location / {
        proxy_pass http://app:8080; #Compose의 Spring 서비스로 전달

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
    }
}