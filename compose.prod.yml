name: sopt-assignment #Compose 프로젝트 이름을 고정

services:
  app:
    image: sopt-assignment:ec2
    env_file: #EC2에 작성한 운영 DB CORS 설정사용
      - /home/ubuntu/assignment-deploy/.env
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80" #Nginx의 HTTP HTTPS포트를 외부에 공개
      - "443:443"
    volumes:
      - ./deploy/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro #EC2 인증서 폴더를 읽기 전용으로
      - /var/www/certbot:/var/www/certbot:ro #인증서 갱신 확인용 파일을 Nginx가 읽도록
    depends_on:
      - app
    restart: unless-stopped #비정상 종료나 Docker재시작 시 자동 시작. 직접 중지한 컨테이너는 제외