spring:
  application:
    name: assignment

  datasource:
    url: jdbc:mysql://localhost:3306/assignment
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
            scope:
              - read:user
              - user:email

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# OAuth state 왕복에만 사용하는 임시 세션 쿠키 설정
server:
  servlet:
    session:
      timeout: 5m
      cookie:
        name: OAUTH2SESSION
        http-only: true
        secure: ${app.cookie.secure:true}
        same-site: lax

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분, 밀리초 단위
  refresh-token-expiration: 604800000 # 7일, 밀리초 단위
